name: Sunrise
options:
  bundleIdPrefix: com.mason
  deploymentTarget:
    iOS: "17.0"
targets:
  Sunrise:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: "Controls your bedroom LED strips."
        NSBluetoothPeripheralUsageDescription: "Controls your bedroom LED strips."
        UIBackgroundModes:
          - bluetooth-central
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mason.sunrise
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
